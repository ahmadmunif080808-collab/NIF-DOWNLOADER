<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NIFFF DOWNLOADER</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;background:#101522;color:white;
  font-family:Arial,sans-serif;min-height:100vh;
  display:grid;place-items:center;padding:20px
}
.container{
  width:100%;max-width:480px;background:#1b2435;
  padding:25px;border-radius:18px;
  border:1px solid #35415a
}
h2{text-align:center;color:#62a5ff}
p{text-align:center;color:#aab6ca}
label{display:block;margin:18px 0 8px}
input,select,button{
  width:100%;padding:14px;border-radius:10px;font-size:15px
}
input,select{
  background:#101522;color:white;border:1px solid #46536b
}
button{
  margin-top:20px;background:#2678ed;color:white;
  border:0;font-weight:bold
}
#message{margin-top:16px;text-align:center;color:#ffcc75}
</style>
</head>
<body>
<div class="container">
  <h2>NIFFF DOWNLOADER</h2>
  <p>Simple • Fast • Easy</p>

  <label for="url">Link file yang boleh diunduh</label>
  <input id="url" type="url" placeholder="https://contoh.com/file.mp4">

  <button onclick="downloadFile()">MULAI DOWNLOAD</button>
  <div id="message">Siap digunakan untuk link file langsung.</div>
  <p>Gunakan hanya file milik sendiri atau yang diizinkan pemiliknya.</p>
</div>

<script>
function downloadFile(){
  const input=document.getElementById("url");
  const message=document.getElementById("message");

  let file;
  try{
    file=new URL(input.value.trim());
    if(file.protocol!=="https:") throw new Error();
  }catch(e){
    message.textContent="Masukkan link HTTPS yang valid.";
    return;
  }

  message.textContent="Membuka link file...";

  const link=document.createElement("a");
  link.href=file.href;
  link.target="_blank";
  link.rel="noopener noreferrer";
  document.body.appendChild(link);
  link.click();
  link.remove();

  message.textContent="Link file sudah dibuka. Jika tidak terunduh otomatis, gunakan tombol download dari halaman file.";
}
</script>
</body>
</html>
