<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NIFFF DOWNLOADER V3</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;padding:20px;
  display:grid;place-items:center;
  background:#0b1020;color:white;
  font-family:Arial,sans-serif
}
.container{
  width:100%;max-width:480px;padding:25px;
  background:#172238;border:1px solid #34445f;
  border-radius:18px
}
.logo{text-align:center;color:#62a5ff;font-size:27px;font-weight:bold}
.subtitle{text-align:center;color:#aab6ca}
label{display:block;margin:17px 0 8px}
input,select,button{
  width:100%;padding:14px;border-radius:10px;font-size:15px
}
input,select{
  background:#0b1020;color:white;border:1px solid #43516b
}
button{
  margin-top:20px;background:#2678ed;color:white;
  border:0;font-weight:bold
}
#message{text-align:center;margin-top:17px;color:#ffcf80;line-height:1.5}
.info{text-align:center;color:#aab6ca;font-size:12px;line-height:1.6;margin-top:20px}
</style>
</head>
<body>
<main class="container">
  <div class="logo">NIFFF DOWNLOADER</div>
  <p class="subtitle">V3 • Simple • Fast • Easy</p>

  <label for="platform">Pilih platform</label>
  <select id="platform">
    <option value="youtube">YouTube</option>
    <option value="tiktok">TikTok</option>
    <option value="instagram">Instagram</option>
    <option value="facebook">Facebook</option>
    <option value="direct">Link file langsung</option>
  </select>

  <label for="format">Format</label>
  <select id="format">
    <option value="mp4">Video MP4</option>
    <option value="mp3">Audio MP3</option>
  </select>

  <label for="url">Masukkan link</label>
  <input id="url" type="url" placeholder="Tempel link di sini">

  <button onclick="startDownload()">MULAI DOWNLOAD</button>
  <div id="message">Memeriksa koneksi backend...</div>

  <p class="info">
    Gunakan konten milik sendiri atau yang kamu punya izin untuk mengunduhnya.
    Pengunduhan dari platform memerlukan dukungan resmi.
  </p>
</main>

<script>
const API="https://nifff-downloader-api.ahmadmunif080808.workers.dev";

async function checkBackend(){
  const message=document.getElementById("message");
  try{
    const response=await fetch(API);
    const data=await response.json();
    message.textContent=data.status==="online"
      ?"Backend NIFFF terhubung."
      :"Backend belum siap.";
  }catch(error){
    message.textContent="Backend belum dapat dihubungi.";
  }
}

async function startDownload(){
  const platform=document.getElementById("platform").value;
  const format=document.getElementById("format").value;
  const url=document.getElementById("url").value.trim();
  const message=document.getElementById("message");

  if(!url){
    message.textContent="Masukkan link terlebih dahulu.";
    return;
  }

  try{
    const parsed=new URL(url);
    if(!["https:","http:"].includes(parsed.protocol))
      throw new Error();
  }catch(error){
    message.textContent="Link tidak valid.";
    return;
  }

  if(platform!=="direct"){
    message.textContent=
      "Backend untuk "+platform.toUpperCase()+" "+format.toUpperCase()+
      " belum tersedia. Gunakan metode unduhan resmi dari platform.";
    return;
  }

  message.textContent="Memeriksa link file...";

  try{
    const response=await fetch(
      API+"/download?url="+encodeURIComponent(url)
    );
    const data=await response.json();
    message.textContent=data.error || "Permintaan selesai.";
  }catch(error){
    message.textContent="Gagal menghubungi backend.";
  }
}

checkBackend();
</script>
</body>
</html>
